<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CoWorkSpace - Reservasi Ruangan{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans {% block body_class %}bg-slate-100 text-slate-800 min-h-screen{% endblock %}">

    {% block navbar %}
    {% if user %}
    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-indigo-700">CoWorkSpace</a>
            <div class="flex items-center gap-4 text-sm">
                <span class="text-slate-600">Halo, <strong>{{ user.name or user.email }}</strong></span>
                <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-medium transition">
                    Logout
                </a>
            </div>
        </div>
    </nav>
    {% endif %}
    {% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
