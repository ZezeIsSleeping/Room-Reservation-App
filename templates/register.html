{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow">
    <h1 class="text-2xl font-bold text-center text-indigo-700 mb-6">Registrasi Akun</h1>
    <form method="post" action="/register" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
            <input type="text" name="nama" required class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password" required class="w-full border rounded-lg px-3 py-2">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg">
            Daftar Sekarang
        </button>
    </form>
    <p class="text-center text-sm mt-4">
        Sudah punya akun? <a href="/login" class="text-indigo-600 font-semibold hover:underline">Login</a>
    </p>
</div>
{% endblock %}
