{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow">
    <h1 class="text-2xl font-bold text-center text-indigo-700 mb-2">CoWorkSpace</h1>
    <p class="text-center text-slate-500 text-sm mb-6">Masuk ke sistem reservasi co-working space</p>

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2 focus:outline-indigo-600">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password" required class="w-full border rounded-lg px-3 py-2 focus:outline-indigo-600">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg">
            Login
        </button>
    </form>

    <p class="text-center text-sm mt-4">
        Belum punya akun? <a href="/register" class="text-indigo-600 font-semibold hover:underline">Daftar di sini</a>
    </p>

    <div class="mt-6 p-3 bg-slate-50 rounded border text-xs text-slate-600">
        <p class="font-semibold mb-1">Akun Demo Bawaan:</p>
        <p>Admin: <code>admin@coworking.com</code> / <code>admin123</code></p>
        <p>User: <code>user@coworking.com</code> / <code>user123</code></p>
    </div>
</div>
{% endblock %}
